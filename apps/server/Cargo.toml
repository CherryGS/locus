[package]
name = "locus-server"
version = "0.1.0"
edition = "2024"

[dependencies]
locus-tag.workspace = true
locus-filter.workspace = true
locus-search.workspace = true
locus-query.workspace = true
locus-migration.workspace = true
locus-civitai.workspace = true
locus-settings.workspace = true
anyhow.workspace = true
axum = "=0.8.9"
utoipa = "=5.5.0"
utoipa-axum = "=0.2.0"
async-stream = "=0.3.6"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.4"
sha2 = "0.10"
schemars.workspace = true
tempfile.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde.workspace = true
serde_json.workspace = true
diesel.workspace = true
diesel-async.workspace = true
thiserror.workspace = true
uuid.workspace = true
locus-task.workspace = true
locus-core.workspace = true
locus-store.workspace = true
locus-file.workspace = true
locus-media.workspace = true
locus-model.workspace = true
locus-twitter.workspace = true
locus-bilibili.workspace = true
directories.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs"] }

[dev-dependencies]
blake3 = "1"
image.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[example]]
name = "file-backend"
test = true

[[example]]
name = "media-backend"
test = true

[[example]]
name = "twitter-backend"
test = true

[[example]]
name = "task-backend"
test = true
